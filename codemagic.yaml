workflows:
  ios-release-sideload:
    name: Build iOS IPA for Sideloadly
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter dependencies
        script: |
          flutter pub get

      - name: Build iOS App (Unsigned)
        script: |
          flutter build ipa --release --no-codesign

      - name: Create IPA Package for Sideloadly
        script: |
          mkdir -p build/ios/ipa
          if [ -d "build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app" ]; then
            echo "Packaging Runner.app into Payload IPA..."
            cd build/ios/archive/Runner.xcarchive/Products/Applications
            mkdir -p Payload
            cp -r Runner.app Payload/
            zip -r ../../../../../build/ios/ipa/gdc_customer_app_sideload.ipa Payload
          fi

    artifacts:
      - build/ios/ipa/*.ipa
